name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o Galaxy1Recomp.zip
          rm -rf Galaxy1Recomp/.github
          cp -r Galaxy1Recomp/. .
          rm -rf Galaxy1Recomp Galaxy1Recomp.zip
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Extrair projeto"
          git push
